name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_test
  TEST_DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_test
  JWT_SECRET: ci-only-jwt-secret-with-at-least-thirty-two-characters

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
